[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-posting-analyzer"
version = "0.1.0"
description = "Analyze job postings and match them to your CV with Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-analyzer = "job_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
